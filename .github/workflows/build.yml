name: Build Unity Project

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Setup Unity
      uses: game-ci/unity-builder@v2
      with:
        unityVersion: '2021.2.18f1' # Specify the Unity version you are using
        targetPlatform: StandaloneWindows64 # Change this to your target platform

    - name: Cache Unity packages
      uses: actions/cache@v2
      with:
        path: Library
        key: ${{ runner.os }}-scoped-packages-${{ hashFiles('/Packages/manifest.json') }}
        restore-keys: |
          ${{ runner.os }}-scoped-packages-

    - name: Build project
      uses: game-ci/unity-builder@v2
      with:
        unityVersion: '2021.2.18f1'
        targetPlatform: StandaloneWindows64
        buildMethod: MyCompany.MyGame.BuildScript.PerformBuild # Optional: specify a custom build script method
        buildName: MyGame
        buildOutputDirectory: build

    - name: Upload build artifact
      uses: actions/upload-artifact@v2
      with:
        name: Build
        path: build
        
